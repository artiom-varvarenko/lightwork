<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lightwork</title>
<style>
  :root {
    --bg: #111418; --panel: #1a1f26; --line: #2a313b; --fg: #e6e9ee; --dim: #8a94a3;
    --pass: #39d353; --fail: #ff4d4d; --pend: #ffd60a; --info: #6b93ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 14px system-ui, sans-serif; }
  body { display: grid; grid-template-rows: auto 1fr; grid-template-columns: 1fr 400px; height: 100vh; }
  header { grid-column: 1 / 3; display: flex; gap: 16px; align-items: center; padding: 6px 12px;
           border-bottom: 1px solid var(--line); background: var(--panel); }
  header .title { font-weight: 700; letter-spacing: .04em; }
  #banner { display: none; background: #b3001b; color: #fff; font-weight: 700; padding: 2px 10px; border-radius: 3px; }
  #banner.on { display: inline-block; }
  #runinfo, #cost, #link { color: var(--dim); }
  #cost { margin-left: auto; }
  #stage { position: relative; min-height: 0; min-width: 0; }
  #view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: default; }
  #view.picking { cursor: crosshair; }
  #tools { position: absolute; left: 8px; bottom: 8px; display: none; gap: 6px; align-items: center;
           background: rgba(20,24,30,.9); padding: 6px 8px; border-radius: 4px; border: 1px solid var(--line); }
  #tools.on { display: flex; }
  #tools .hint { color: var(--dim); margin-left: 6px; }
  aside { border-left: 1px solid var(--line); background: var(--panel); overflow-y: auto; padding: 10px;
          display: flex; flex-direction: column; gap: 12px; min-height: 0; }
  h2 { margin: 0 0 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); }
  button, select { background: #252c36; color: var(--fg); border: 1px solid var(--line); border-radius: 4px;
                   padding: 5px 9px; font: inherit; cursor: pointer; }
  button:hover { background: #2f3844; }
  button.on { border-color: var(--info); color: #fff; }
  #start { font-size: 16px; font-weight: 700; padding: 10px; background: #1f6f3a; border-color: #2d8f4e; }
  #start.done { background: #252c36; font-size: 13px; font-weight: 400; padding: 5px 9px; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; }
  #hud { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-family: ui-monospace, monospace; }
  #hud .k { color: var(--dim); }
  #hud .live { color: var(--pass); } #hud .error { color: var(--fail); } #hud .speech { color: var(--pend); }
  #steps { list-style: none; margin: 0; padding: 0; }
  #steps li { padding: 5px 6px; border-left: 3px solid transparent; border-radius: 2px; }
  #steps li .id { color: var(--dim); font-family: ui-monospace, monospace; margin-right: 6px; }
  #steps li .st { float: right; font-size: 11px; color: var(--dim); }
  #steps li.active { border-left-color: var(--info); background: #222a35; }
  #steps li.provisional { border-left-color: var(--pend); }
  #steps li.passed .st { color: var(--pass); } #steps li.failed .st, #steps li.recovery .st { color: var(--fail); }
  #steps li.unverified .st { color: var(--pend); }
  #steps li .reason { color: var(--fail); font-size: 12px; }
  .chips { margin-top: 3px; display: flex; gap: 4px; flex-wrap: wrap; }
  .chip { font-size: 11px; padding: 1px 6px; border-radius: 9px; border: 1px solid var(--line); }
  .chip.pass { border-color: var(--pass); color: var(--pass); }
  .chip.fail { border-color: var(--fail); color: var(--fail); }
  .chip.pending, .chip.inconclusive { border-color: var(--pend); color: var(--pend); }
  #say { font-style: italic; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; font-family: ui-monospace, monospace; }
  td, th { text-align: left; padding: 2px 4px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td.model { max-width: 170px; overflow: hidden; text-overflow: ellipsis; }
  th { color: var(--dim); font-weight: 400; }
  td.num { text-align: right; }
  td.ok { color: var(--pass); } td.error, td.timeout { color: var(--fail); } td.pending { color: var(--pend); }
  #stats { color: var(--dim); font-size: 12px; font-family: ui-monospace, monospace; }
</style>
</head>
<body>
<header>
  <span class="title">LIGHTWORK</span>
  <span id="banner"></span>
  <span id="runinfo"></span>
  <span id="cost"></span>
  <span id="link">offline</span>
</header>
<div id="stage">
  <canvas id="view"></canvas>
  <div id="tools">
    <select id="obj"></select>
    <button id="t-corners" title="Click the 4 corner cells/corners: TL, TR, BR, BL">4 corners</button>
    <button id="t-rect" title="Drag a rectangle">Rectangle</button>
    <button id="t-area" title="Drag the work area">Work area</button>
    <button id="t-accept">Accept layout</button>
    <span class="hint" id="hint"></span>
  </div>
</div>
<aside>
  <button id="start">Start (speech + mic)</button>
  <section>
    <h2>Voice</h2>
    <div id="hud">
      <span class="k">VOICE</span><span id="hud-voice">off</span>
      <span class="k">TURN</span><span id="hud-turn">-</span>
      <span class="k">HEARD</span><span id="hud-heard">-</span>
      <span class="k">MIC</span><span id="hud-mic">off</span>
    </div>
  </section>
  <section>
    <div class="row">
      <button data-action="confirm" title="space">Done</button>
      <button data-action="repeat" title="r">Repeat</button>
      <button data-action="why" title="w">Why</button>
      <button data-action="back" title="b">Back</button>
    </div>
  </section>
  <section>
    <h2>Steps</h2>
    <div id="say"></div>
    <ul id="steps"></ul>
  </section>
  <section>
    <h2>Model trace</h2>
    <table><thead><tr><th>role</th><th>model</th><th>status</th><th>ms</th><th>$</th></tr></thead>
      <tbody id="trace"></tbody></table>
  </section>
  <div id="stats"></div>
</aside>
<script type="module" src="/static/js/screen.js"></script>
</body>
</html>
