<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Lightwork projector</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  #tap {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: #000; color: #fff; font: bold 6vh system-ui, sans-serif; text-align: center; cursor: pointer;
  }
  #tap.hidden { display: none; }
  html.rot180 #tap { transform: rotate(180deg); }
  #diag { margin-top: 4vh; font: 3vh ui-monospace, monospace; color: #0f0; white-space: pre; text-align: left; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="tap">Tap to start<div id="diag"></div></div>
<script type="module" src="/static/js/projector.js"></script>
</body>
</html>
