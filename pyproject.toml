[project]
name = "lightwork"
version = "0.1.0"
description = "Any procedure, on the real thing, verified: projected guidance gated by Meta models and deterministic evidence."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "opencv-contrib-python>=4.10",
    "numpy>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.28",
    "pydantic>=2.9",
    "meta-sam-parser>=0.1.0",
]

[project.optional-dependencies]
live = ["mediapipe>=1.2.0"]

[project.scripts]
lightwork = "lightwork.cli:main"

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lightwork"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --import-mode=importlib"
